
services:
  - type: web
    name: reelspin-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install "fastapi[standard]>=0.141.1" "psycopg[binary]>=3.3.5" "pwdlib[argon2]>=0.3.1" "pyjwt>=2.14.0" "python-dotenv>=1.2.3" "sqlalchemy>=2.0.52" "email-validator>=2.3.0"
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
